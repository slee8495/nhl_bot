name: NHL Quant Bot

on:
  schedule:
    # =========================
    # ✅ Daily run @ 9:00 PM PT (PST)
    # -------------------------
    # 09:00 PT (PST, UTC-8) = 09:00 UTC
    - cron: "0 5 * * *"
    # =========================
    
    # ✅ Annual retrain (Aug 1)
    # -------------------------
    # Aug is typically PDT (UTC-7): 06:00 PT = 13:00 UTC
    # - cron: "0 13 1 8 *"
    # =========================

    # ======================================================
    # Hourly options (PT) — uncomment ONLY the cron line you want
    # Note: GitHub Actions cron is UTC
    # ------------------------------------------------------
    # ---- PST (UTC-8) : 09:00–20:00 PT => 17:00–04:00 UTC ----
    # 9 AM  (PST) = 17:00 UTC
    - cron: "0 17 * * *"

    # 10 AM (PST) = 18:00 UTC
    # - cron: "0 18 * * *"

    # 11 AM (PST) = 19:00 UTC
    # - cron: "0 19 * * *"

    # 12 PM (PST) = 20:00 UTC
    # - cron: "0 20 * * *"

    # 1 PM  (PST) = 21:00 UTC
    # - cron: "0 21 * * *"

    # 2 PM  (PST) = 22:00 UTC
    - cron: "0 22 * * *"

    # 3 PM  (PST) = 23:00 UTC
    # - cron: "0 23 * * *"

    # 4 PM  (PST) = 00:00 UTC (next day)
    - cron: "0 0 * * *"

    # 5 PM  (PST) = 01:00 UTC (next day)
    # - cron: "0 1 * * *"

    # 6 PM  (PST) = 02:00 UTC (next day)
    # - cron: "0 2 * * *"

    # 7 PM  (PST) = 03:00 UTC (next day)
    # - cron: "0 3 * * *"

    # 8 PM  (PST) = 04:00 UTC (next day)
    # - cron: "0 4 * * *"
    # ======================================================

  workflow_dispatch:
    inputs:
      run_mode:
        description: "Select which script to run"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - next_day

permissions:
  contents: write

jobs:
  nhl-quant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install cryptography
          pip install -r requirements.txt

      # ✅ Ensure folders exist + keep them visible in GitHub (empty folder issue)
      - name: Ensure data/models dirs exist
        run: |
          mkdir -p data models
          test -f models/.gitkeep || echo "" > models/.gitkeep
          test -f data/.gitkeep || echo "" > data/.gitkeep

      # ✅ Detect annual retrain run (Aug 1 cron)
      - name: Detect annual retrain run
        id: retrain_flag
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 13 1 8 *" ]; then
            echo "is_retrain=true" >> $GITHUB_OUTPUT
          else
            echo "is_retrain=false" >> $GITHUB_OUTPUT
          fi

      # ✅ Detect next-day script usage:
      # - scheduled 9:00 PM PT (0 5 * * *) => next_day
      # - manual run: depends on inputs.run_mode
      - name: Detect next-day run (schedule or manual)
        id: nextday_flag
        run: |
          # Manual run: use input selection
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.run_mode }}" = "next_day" ]; then
              echo "use_nextday=true" >> $GITHUB_OUTPUT
            else
              echo "use_nextday=false" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # Scheduled run: 9:00 PM PT (PST) = 05:00 UTC => "0 5 * * *"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "use_nextday=true" >> $GITHUB_OUTPUT
          else
            echo "use_nextday=false" >> $GITHUB_OUTPUT
          fi

      # ✅ Check if PKLs exist (MUST match config.py paths)
      - name: Check if model PKLs exist
        id: model_check
        run: |
          WIN_PKL="models/nhl_xgb_win.pkl"
          MARGIN_PKL="models/nhl_xgb_margin.pkl"

          if [ -f "$WIN_PKL" ] && [ -f "$MARGIN_PKL" ]; then
            echo "need_train=false" >> $GITHUB_OUTPUT
            echo "PKLs found. Will reuse."
          else
            echo "need_train=true" >> $GITHUB_OUTPUT
            echo "PKLs missing. Will train and commit."
          fi

      # ✅ Train if missing OR annual retrain day
      - name: Train NHL Model (only when missing or annual retrain)
        if: steps.model_check.outputs.need_train == 'true' || steps.retrain_flag.outputs.is_retrain == 'true'
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          BALLDONTLIE_BASE_URL: ${{ secrets.BALLDONTLIE_BASE_URL }}
        run: |
          python nhl_train_quant.py

      # ✅ Commit & push PKLs (+ .gitkeep) if training ran
      - name: Commit & push updated PKLs (and keep files)
        if: steps.model_check.outputs.need_train == 'true' || steps.retrain_flag.outputs.is_retrain == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add models/nhl_xgb_win.pkl models/nhl_xgb_margin.pkl models/.gitkeep data/.gitkeep || true
          git status

          git diff --cached --quiet && echo "No model changes to commit." && exit 0

          git commit -m "Update NHL model PKLs (auto)"
          git push

      # ✅ Run bot (daily + retrain day)
      - name: Run NHL Quant Bot
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          BALLDONTLIE_BASE_URL: ${{ secrets.BALLDONTLIE_BASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_BASE_URL: ${{ secrets.ODDS_API_BASE_URL }}
        run: |
          if [ "${{ steps.nextday_flag.outputs.use_nextday }}" = "true" ]; then
            echo "[RUN] Using next-day script: nhl_quant_main_next_day.py"
            python nhl_quant_main_next_day.py
          else
            echo "[RUN] Using normal script: nhl_quant_main.py"
            python nhl_quant_main.py
          fi
